group = "com.flutter_ts_identity_orchestration"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url('https://transmit.jfrog.io/artifactory/transmit-security-gradle-release-local/')
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.flutter_ts_identity_orchestration"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    dependencies {
        implementation "com.ts.sdk:identityorchestration:1.0.34"

        // Modular IDV (document/selfie acquisition) is deliberately NOT declared here. It is
        // opt-in: an app that wants it adds `com.ts.sdk:identityverification` itself, so apps
        // that do not want it ship neither IDV nor its transitive accountprotection. Integrator
        // instructions live in UserGuide.md under "Modular IDV".
        //
        // This module's own sources reference ZERO IDV symbols - every Modular IDV type used here
        // (ITSUIHandler, TSIDVStepHandler, TSIDVAcquisitionContext, TSAcquisitionStepData) belongs
        // to ido-android-sdk. IDV is needed only to satisfy ido-android-sdk's own runtime probe
        // (`Class.forName("com.transmit.identityverification.TSIdentityVerification")` in
        // ModularIDVControllerFactory), so dropping it costs no compilation.
        //
        // Version tolerance on THIS platform is a real SDK guarantee, not an assumption:
        // ido-android-sdk's IDVAdapter reaches the IDV SDK entirely by reflection and maps any
        // ReflectiveOperationException to TSIdoErrorCode.IdvNotAvailable, so an absent IDV and a
        // too-old IDV produce the SAME graceful outcome - the journey is rejected, nothing
        // crashes. iOS does NOT share this property (see the comment in ios/.../Package.swift),
        // which is why UserGuide.md states 1.3.5 as a hard minimum for both platforms rather than
        // describing Android's laxer behaviour as the contract.
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
