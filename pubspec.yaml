name: flutter_ts_identity_orchestration
description: "A Flutter plugin for the Transmit Security Identity Orchestration SDK."
version: 0.0.5
homepage: transmitsecurity.com

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flutter_ts_identity_orchestration
        pluginClass: FlutterTsIdentityOrchestrationPlugin
      ios:
        pluginClass: FlutterTsIdentityOrchestrationPlugin

